<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#075bbf" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tec Escola" />
    <link rel="icon" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title></title>
    <script id="early-favicon-bootstrap">
      (function applyCachedHostBranding() {
        const defaultFavicon = '/media/tec-escola-favicon.png?v=1401';
        const neutralInstitutionalHosts = new Set([
          'admin', 'api', 'app', 'assets', 'auth', 'blog', 'cdn', 'dashboard',
          'dev', 'docs', 'grupotec', 'help', 'login', 'mail', 'media', 'platform',
          'portal', 'privacy', 'resend', 'root', 'send', 'smtp', 'staging', 'static',
          'status', 'suporte', 'support', 'tecescola', 'terms', 'test', 'www',
        ]);
        let faviconHref = defaultFavicon;
        let title = 'Tec Escola';

        try {
          const hostname = window.location.hostname
            .trim()
            .toLowerCase()
            .replace(/\.$/, '');
          const labels = hostname.split('.');
          const institutionalSubdomain =
            labels.length === 4 &&
            labels.slice(1).join('.') === 'grupotec.dev.br' &&
            !neutralInstitutionalHosts.has(labels[0]);
          const cacheKey = `tecescola:public-branding:${hostname}`;
          const raw = window.localStorage.getItem(cacheKey);
          if (institutionalSubdomain) {
            faviconHref = null;
            title = '';
          }

          if (raw) {
            const cached = JSON.parse(raw);
            if (
              cached?.version === 2 &&
              cached?.hostname === hostname &&
              typeof cached.cachedAt === 'number' &&
              Number.isFinite(cached.cachedAt) &&
              cached.cachedAt > 0 &&
              cached.cachedAt <= Date.now() + 60_000 &&
              cached.branding &&
              (institutionalSubdomain
                ? cached.branding.scope === 'INSTITUTION'
                : cached.branding.scope !== 'INSTITUTION')
            ) {
              const cachedBranding = cached.branding;
              title =
                cachedBranding.documentTitle ||
                cachedBranding.displayName ||
                (institutionalSubdomain ? '' : 'Tec Escola');
              const cachedAsset =
                cachedBranding.faviconUrl ||
                (institutionalSubdomain ? cachedBranding.logoUrl : null);
              if (typeof cachedAsset === 'string') {
                const assetUrl = new URL(cachedAsset);
                if (assetUrl.protocol === 'https:') {
                  faviconHref = assetUrl.href;
                }
              } else if (institutionalSubdomain) {
                faviconHref = null;
              }
            }
          }
        } catch {
          // An invalid cache never supplies an institution's identity.
        }

        let faviconLink = document.querySelector('link[rel~="icon"]');
        if (!faviconLink) {
          faviconLink = document.createElement('link');
          faviconLink.rel = 'icon';
          document.head.appendChild(faviconLink);
        }
        if (faviconHref) {
          faviconLink.href = faviconHref;
        } else {
          faviconLink.removeAttribute('href');
        }
        document.title = title;
      })();
    </script>
    <link rel="apple-touch-icon" href="/icons/tecescola-192.png" />
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="notranslate" translate="no">
    <div id="initial-branding-splash" aria-label="Carregando identidade visual">
      <span class="initial-branding-splash__loader" aria-hidden="true"></span>
    </div>
    <div id="root"></div>
    <style>
      #initial-branding-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #eef3fc center/cover no-repeat; color: #64748b; }
      .initial-branding-splash__logo { width: min(180px, 42vw); height: min(180px, 42vw); object-fit: contain; filter: drop-shadow(0 8px 18px rgba(15, 23, 42, .18)); }
      .initial-branding-splash__loader { width: 52px; height: 52px; border: 4px solid rgba(100, 116, 139, .2); border-top-color: #005bbf; border-radius: 999px; animation: initial-branding-spin .8s linear infinite; }
      @keyframes initial-branding-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
