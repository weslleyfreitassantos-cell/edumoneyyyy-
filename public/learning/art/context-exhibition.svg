<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">Percurso de uma exposição fictícia</title>
  <desc id="desc">Três salas chamadas Memória, Trabalho e Mudanças estão conectadas por setas da entrada à saída.</desc>
  <rect width="600" height="360" fill="#f4f0e6"/>
  <rect x="34" y="72" width="160" height="212" rx="6" fill="#e6d7bd" stroke="#42636a" stroke-width="5"/>
  <rect x="220" y="72" width="160" height="212" rx="6" fill="#d7e4dd" stroke="#42636a" stroke-width="5"/>
  <rect x="406" y="72" width="160" height="212" rx="6" fill="#dae5e8" stroke="#42636a" stroke-width="5"/>
  <text x="114" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#263f46">Memória</text>
  <text x="300" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#263f46">Trabalho</text>
  <text x="486" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#263f46">Mudanças</text>
  <circle cx="114" cy="205" r="29" fill="#c9814f"/><rect x="270" y="175" width="60" height="60" fill="#438188"/><path d="M460 235l26-62 26 62z" fill="#d4aa4e"/>
  <path d="M194 177h24 M380 177h24" stroke="#315c63" stroke-width="6"/><path d="M210 165l13 12-13 12 M396 165l13 12-13 12" fill="none" stroke="#315c63" stroke-width="5"/>
  <text x="58" y="320" font-family="Arial,sans-serif" font-size="15" fill="#263f46">Entrada</text><text x="499" y="320" font-family="Arial,sans-serif" font-size="15" fill="#263f46">Saída</text>
</svg>
