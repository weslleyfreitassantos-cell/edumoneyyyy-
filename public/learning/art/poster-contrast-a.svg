  <rect width="600" height="750" fill="#f8fafc"/>
  <rect x="28" y="28" width="544" height="694" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="5"/>
  <path d="M52 102h496" stroke="#0f766e" stroke-width="12"/>
  <text x="300" y="158" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">CAMPANHA COMUNITÁRIA</text>
  <rect x="70" y="205" width="460" height="256" rx="10" fill="#fde047"/>
  <text x="300" y="278" text-anchor="middle" fill="#172554" font-family="Arial, sans-serif" font-size="44" font-weight="800">FEIRA DE TROCAS</text>
