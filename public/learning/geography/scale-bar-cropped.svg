<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-labelledby="title desc">
  <title id="title">Trecho cortado sem escala grafica calibrada</title>
  <desc id="desc">Um fragmento de barra sem inicio, fim, marcas numeradas, unidade ou valor de referencia; nao permite converter o comprimento em distancia real.</desc>
  <rect width="640" height="210" rx="16" fill="#f7fafc"/>
  <rect x="24" y="24" width="592" height="162" rx="12" fill="#fff" stroke="#9bb4c8"/>
  <path d="M-6 106h652" stroke="#176b87" stroke-width="24"/>
  <path d="M146 82v48M308 82v48M472 82v48" stroke="#15283d" stroke-width="3"/>
  <path d="M24 62v88M616 62v88" stroke="#b4472e" stroke-width="5" stroke-dasharray="8 7"/>
  <g font-family="Arial, sans-serif" fill="#15283d">
    <text x="320" y="52" text-anchor="middle" font-size="19" font-weight="700">Referencia de distancia ausente</text>
    <text x="320" y="166" text-anchor="middle" font-size="15">Marcas sem valores e sem unidade; as extremidades foram cortadas.</text>
  </g>
</svg>
