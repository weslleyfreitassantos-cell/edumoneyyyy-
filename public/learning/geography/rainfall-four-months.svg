<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Precipitação mensal de janeiro a abril</title>
  <desc id="desc">Gráfico de linhas com janeiro em 20 milímetros, fevereiro em 30, março em 50 e abril em 90. Todos os pontos aumentam.</desc>
  <rect width="760" height="390" fill="#fff"/>
  <text x="380" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#182b43">Precipitação mensal (mm)</text>
  <g stroke="#d7e0e8" stroke-width="1"><path d="M100 300H700M100 245H700M100 190H700M100 135H700M100 80H700"/></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#44566c" text-anchor="end"><text x="88" y="305">0</text><text x="88" y="250">25</text><text x="88" y="195">50</text><text x="88" y="140">75</text><text x="88" y="85">100</text></g>
  <path d="M100 80V300H700" fill="none" stroke="#23384e" stroke-width="2"/>
  <path d="M160 256L320 234L480 190L640 102" fill="none" stroke="#087e8b" stroke-width="5"/>
  <g fill="#c43d5a" stroke="#fff" stroke-width="3"><circle cx="160" cy="256" r="8"/><circle cx="320" cy="234" r="8"/><circle cx="480" cy="190" r="8"/><circle cx="640" cy="102" r="8"/></g>
  <g font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#182b43" text-anchor="middle"><text x="160" y="239">20</text><text x="320" y="217">30</text><text x="480" y="173">50</text><text x="640" y="85">90</text></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#44566c" text-anchor="middle"><text x="160" y="330">Jan</text><text x="320" y="330">Fev</text><text x="480" y="330">Mar</text><text x="640" y="330">Abr</text></g>
</svg>
