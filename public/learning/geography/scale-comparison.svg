<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Comparacao entre escala grande e pequena</title>
  <desc id="desc">Dois mapas esquematicos. A escala 1 para 10 mil mostra poucos quarteiroes com mais detalhe; a escala 1 para 100 mil cobre uma regiao maior com menos detalhe.</desc>
  <rect width="640" height="260" rx="16" fill="#f7fafc"/>
  <g font-family="Arial, sans-serif" fill="#15283d">
    <text x="28" y="36" font-size="20" font-weight="700">A · 1:10 000</text>
    <text x="342" y="36" font-size="20" font-weight="700">B · 1:100 000</text>
    <rect x="24" y="50" width="276" height="166" rx="10" fill="#fff" stroke="#9bb4c8"/>
    <rect x="340" y="50" width="276" height="166" rx="10" fill="#fff" stroke="#9bb4c8"/>
    <g stroke="#176b87" stroke-width="5" fill="none">
      <path d="M45 104h230M45 158h230M105 66v136M205 66v136"/>
      <path d="M365 102h226M365 158h226M440 66v136M515 66v136" stroke-width="3"/>
    </g>
    <g stroke="#e6a23c" stroke-width="2" fill="none">
      <rect x="55" y="68" width="38" height="24"/><rect x="116" y="68" width="74" height="24"/>
      <rect x="216" y="68" width="48" height="24"/><rect x="55" y="170" width="38" height="28"/>
      <rect x="116" y="170" width="74" height="28"/><rect x="216" y="170" width="48" height="28"/>
    </g>
    <text x="28" y="244" font-size="16">Area menor · mais detalhe</text>
    <text x="344" y="244" font-size="16">Area maior · menos detalhe</text>
  </g>
</svg>
