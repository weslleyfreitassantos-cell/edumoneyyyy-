<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Temperatura média anual em quatro anos</title>
  <desc id="desc">Série hipotética: ano 1, 22 graus Celsius; ano 2, 23; ano 3, 22; ano 4, 24. A linha sobe, cai e volta a subir.</desc>
  <rect width="760" height="390" fill="#fff"/>
  <text x="380" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#182b43">Temperatura média anual (°C)</text>
  <g stroke="#d7e0e8" stroke-width="1"><path d="M100 300H700M100 245H700M100 190H700M100 135H700M100 80H700"/></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#44566c" text-anchor="end"><text x="88" y="305">20</text><text x="88" y="250">21</text><text x="88" y="195">22</text><text x="88" y="140">23</text><text x="88" y="85">24</text></g>
  <path d="M100 80V300H700" fill="none" stroke="#23384e" stroke-width="2"/>
  <path d="M160 190L320 135L480 190L640 80" fill="none" stroke="#087e8b" stroke-width="5"/>
  <g fill="#c43d5a" stroke="#fff" stroke-width="3"><circle cx="160" cy="190" r="8"/><circle cx="320" cy="135" r="8"/><circle cx="480" cy="190" r="8"/><circle cx="640" cy="80" r="8"/></g>
  <g font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#182b43" text-anchor="middle"><text x="160" y="173">22</text><text x="320" y="118">23</text><text x="480" y="173">22</text><text x="640" y="63">24</text></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#44566c" text-anchor="middle"><text x="160" y="330">Ano 1</text><text x="320" y="330">Ano 2</text><text x="480" y="330">Ano 3</text><text x="640" y="330">Ano 4</text></g>
</svg>
