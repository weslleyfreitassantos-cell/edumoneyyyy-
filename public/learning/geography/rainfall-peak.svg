<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Precipitação em três meses</title>
  <desc id="desc">Gráfico de barras com janeiro em 20 milímetros, fevereiro em 80 e março em 30. Fevereiro é o maior valor; março fica acima de janeiro e abaixo de fevereiro.</desc>
  <rect width="760" height="390" fill="#fff"/>
  <text x="380" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#182b43">Precipitação mensal (mm)</text>
  <g stroke="#d7e0e8" stroke-width="1"><path d="M100 300H700M100 245H700M100 190H700M100 135H700M100 80H700"/></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#44566c" text-anchor="end"><text x="88" y="305">0</text><text x="88" y="250">20</text><text x="88" y="195">40</text><text x="88" y="140">60</text><text x="88" y="85">80</text></g>
  <path d="M100 80V300H700" fill="none" stroke="#23384e" stroke-width="2"/>
  <g fill="#087e8b"><rect x="190" y="245" width="90" height="55"/><rect x="355" y="80" width="90" height="220"/><rect x="520" y="217.5" width="90" height="82.5"/></g>
  <g font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#182b43" text-anchor="middle"><text x="235" y="232">20</text><text x="400" y="66">80</text><text x="565" y="204">30</text></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#44566c" text-anchor="middle"><text x="235" y="330">Jan</text><text x="400" y="330">Fev</text><text x="565" y="330">Mar</text></g>
</svg>
