<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Precipitação em duas estações</title>
  <desc id="desc">Valores de janeiro a abril. Estação A: 30, 40, 90 e 100 milímetros. Estação B: 30, 45, 65 e 70 milímetros. Em abril, A registra 30 milímetros a mais.</desc>
  <rect width="760" height="430" fill="#fff"/>
  <text x="380" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#182b43">Precipitação mensal por estação (mm)</text>
  <g stroke="#d7e0e8" stroke-width="1"><path d="M100 320H700M100 260H700M100 200H700M100 140H700M100 80H700"/></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#44566c" text-anchor="end"><text x="88" y="325">0</text><text x="88" y="265">25</text><text x="88" y="205">50</text><text x="88" y="145">75</text><text x="88" y="85">100</text></g>
  <path d="M100 80V320H700" fill="none" stroke="#23384e" stroke-width="2"/>
  <path d="M160 248L320 224L480 104L640 80" fill="none" stroke="#087e8b" stroke-width="4"/>
  <path d="M160 248L320 212L480 164L640 152" fill="none" stroke="#c43d5a" stroke-width="4"/>
  <g fill="#087e8b" stroke="#fff" stroke-width="2"><circle cx="160" cy="248" r="7"/><circle cx="320" cy="224" r="7"/><circle cx="480" cy="104" r="7"/><circle cx="640" cy="80" r="7"/></g>
  <g fill="#c43d5a" stroke="#fff" stroke-width="2"><rect x="154" y="242" width="12" height="12"/><rect x="314" y="206" width="12" height="12"/><rect x="474" y="158" width="12" height="12"/><rect x="634" y="146" width="12" height="12"/></g>
  <g font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#182b43" text-anchor="middle"><text x="640" y="61">100</text><text x="640" y="139">70</text></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#44566c" text-anchor="middle"><text x="160" y="350">Jan</text><text x="320" y="350">Fev</text><text x="480" y="350">Mar</text><text x="640" y="350">Abr</text></g>
  <g font-family="Arial,sans-serif" font-size="15" font-weight="700"><circle cx="275" cy="390" r="6" fill="#087e8b"/><text x="289" y="395" fill="#182b43">Estação A</text><rect x="415" y="384" width="12" height="12" fill="#c43d5a"/><text x="435" y="395" fill="#182b43">Estação B</text></g>
</svg>
