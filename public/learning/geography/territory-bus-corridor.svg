<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Corredor de ônibus e comércios</title>
  <desc id="desc">Uma linha de ônibus cruza o bairro de oeste a leste, com quatro paradas e três comércios próximos. Casas aparecem ao norte e ao sul. Não há dados de horários.</desc>
  <rect width="720" height="360" fill="#f7f9fc"/>
  <g fill="#dce6ef" stroke="#60758a" stroke-width="2">
    <rect x="58" y="44" width="112" height="76" rx="8"/><rect x="218" y="44" width="112" height="76" rx="8"/>
    <rect x="390" y="44" width="112" height="76" rx="8"/><rect x="550" y="44" width="112" height="76" rx="8"/>
    <rect x="58" y="240" width="112" height="76" rx="8"/><rect x="218" y="240" width="112" height="76" rx="8"/>
    <rect x="390" y="240" width="112" height="76" rx="8"/><rect x="550" y="240" width="112" height="76" rx="8"/>
  </g>
  <path d="M42 181 H678" stroke="#1b70b7" stroke-width="18" stroke-linecap="round"/>
  <g fill="#fff" stroke="#164e80" stroke-width="4"><circle cx="130" cy="181" r="16"/><circle cx="290" cy="181" r="16"/><circle cx="450" cy="181" r="16"/><circle cx="610" cy="181" r="16"/></g>
  <g fill="#f6c453" stroke="#8a6110" stroke-width="3"><path d="M112 140h36v25h-36z"/><path d="M272 140h36v25h-36z"/><path d="M592 140h36v25h-36z"/></g>
  <g fill="#263747" font-family="Arial,sans-serif" font-size="18" font-weight="700"><text x="68" y="28">NORTE</text><text x="70" y="342">SUL</text><text x="268" y="220">LINHA DE ONIBUS</text></g>
  <g fill="#4c5f72" font-family="Arial,sans-serif" font-size="15"><text x="113" y="132">COMERCIO</text><text x="273" y="132">COMERCIO</text><text x="593" y="132">COMERCIO</text></g>
</svg>
