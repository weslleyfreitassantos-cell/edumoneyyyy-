name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Validar Edge Functions
        shell: bash
        run: |
          set -euo pipefail

          functions=(
            create-client-account
            create-institution
            update-client-account
            update-institution-status
            restore-client-account
            delete-client-account
            invite-school-user
            send-school-email
            update-client-admin-password
            camera-gateway
          )

          for function_name in "${functions[@]}"; do
            function_dir="supabase/functions/$function_name"

            echo "Checking $function_name"

            deno check \
              --frozen \
              --config "$function_dir/deno.json" \
              --lock "$function_dir/deno.lock" \
              "$function_dir/index.ts"

            deno lint \
              --config "$function_dir/deno.json" \
              "$function_dir/index.ts"
          done

      - name: Validar projeto
        run: npm run check

      - name: Testar guard de promoção seletiva de migration
        run: bash scripts/db/promote-single-migration.test.sh

  database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck do Playwright Tec Inglês
        run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --types node --skipLibCheck --esModuleInterop e2e/tec-english-interactive.spec.ts

      - name: Preparar stack mínimo do Supabase para CI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("supabase/config.toml")
          config = path.read_text()
          project_id = 'project_id = "edumoneyyyy-"'
          if project_id not in config:
              raise SystemExit("Missing expected Supabase project_id")
          config = config.replace(project_id, 'project_id = "edumoneyyyy-ci"', 1)
          replacements = {
              "[local_smtp]\nenabled = true": "[local_smtp]\nenabled = false",
              "[storage.vector]\nenabled = true": "[storage.vector]\nenabled = false",
              "[edge_runtime]\nenabled = true": "[edge_runtime]\nenabled = false",
              "[analytics]\nenabled = true": "[analytics]\nenabled = false",
          }

          for current, replacement in replacements.items():
              if current not in config:
                  raise SystemExit(f"Missing expected Supabase config block: {current.splitlines()[0]}")
              config = config.replace(current, replacement, 1)

          path.write_text(config)
          PY

      - name: Iniciar Supabase descartável
        run: npx supabase start --exclude edge-runtime,imgproxy,logflare,mailpit,studio,supavisor,vector

      - name: Provar baseline de produção mais a migration da PR #277
        run: npx supabase db reset --local --version 20261003001200 --no-seed

      - name: Exportar credenciais locais para a prova isolada sem exibição
        shell: bash
        run: |
          set -euo pipefail
          status_output="$(npx supabase status -o env)"
          value_for() {
            printf '%s\n' "$status_output" |
              sed -n "s/^$1=//p" |
              head -n 1 |
              sed -E "s/^[\\\"']//; s/[\\\"']$//"
          }

          {
            echo "MULTI_TENANT_SUPABASE_URL=$(value_for API_URL)"
            echo "MULTI_TENANT_SUPABASE_ANON_KEY=$(value_for ANON_KEY)"
            echo "MULTI_TENANT_SUPABASE_SERVICE_ROLE_KEY=$(value_for SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"

      - name: Teste dinâmico isolado do roster da PR #277
        run: npx vitest run supabase/tests/adaptiveLearningEngine.local.test.ts -t "teacher roster RPC normalizes legacy enrollment statuses"

      - name: Aplicar migrations em banco Linux
        run: npx supabase db reset --local

      - name: Teste dinâmico isolado dos rascunhos de matrícula
        run: npx vitest run supabase/tests/studentEnrollmentDrafts.local.test.ts

      - name: Lint das migrations
        run: npx supabase db lint --local --fail-on error

      - name: Confirmar ausência de drift
        shell: bash
        run: |
          set -euo pipefail
          set +e
          diff_output="$(npx supabase db diff --local --schema public 2>&1)"
          diff_status=$?
          set -e

          if [ "$diff_status" -ne 0 ]; then
            printf '%s\n' "$diff_output"
            exit "$diff_status"
          fi

          if ! grep -qi "no schema changes found" <<< "$diff_output"; then
            printf '%s\n' "$diff_output"
            echo "Unexpected schema drift detected"
            exit 1
          fi

      - name: Exportar credenciais locais sem exibição
        shell: bash
        run: |
          set -euo pipefail
          status_output="$(npx supabase status -o env)"
          value_for() {
            printf '%s\n' "$status_output" |
              sed -n "s/^$1=//p" |
              head -n 1 |
              sed -E "s/^[\\\"']//; s/[\\\"']$//"
          }

          {
            echo "MULTI_TENANT_SUPABASE_URL=$(value_for API_URL)"
            echo "MULTI_TENANT_SUPABASE_ANON_KEY=$(value_for ANON_KEY)"
            echo "MULTI_TENANT_SUPABASE_SERVICE_ROLE_KEY=$(value_for SERVICE_ROLE_KEY)"
            echo "VITE_SUPABASE_URL=$(value_for API_URL)"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$(value_for ANON_KEY)"
          } >> "$GITHUB_ENV"

      - name: Testes dinâmicos de segurança e RPCs adaptativos
        run: npx vitest run supabase/tests/adaptiveLearningEngine.local.test.ts supabase/tests/timetableManualEditor.local.test.ts supabase/tests/directorPanorama.local.test.ts supabase/tests/inventoryManagement.local.test.ts supabase/tests/psychologyWorkflows.local.test.ts supabase/tests/financeV2.local.test.ts

      - name: Diagnosticar replicação Realtime sem expor dados
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | awk '/^supabase_db_/{print; exit}')"
          realtime_container="$(docker ps --format '{{.Names}}' | awk '/^supabase_realtime_/{print; exit}')"

          if [[ -z "$db_container" || -z "$realtime_container" ]]; then
            echo "realtime_diagnostics=containers_unavailable"
            exit 0
          fi

          docker exec "$db_container" psql -U postgres -d postgres -Atqc "
            SELECT 'realtime_publication=' || EXISTS (
              SELECT 1 FROM pg_publication WHERE pubname = 'supabase_realtime'
            );
            SELECT 'psychology_messages_published=' || EXISTS (
              SELECT 1 FROM pg_publication_tables
              WHERE pubname = 'supabase_realtime'
                AND schemaname = 'public'
                AND tablename = 'psychology_messages'
            );
            SELECT 'psychology_broadcast_trigger=' || EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname = 'psychology_message_broadcast_after_insert'
                AND tgrelid = 'public.psychology_messages'::regclass
                AND NOT tgisinternal
            );
            SELECT 'psychology_broadcast_read_policy=' || EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'realtime'
                AND tablename = 'messages'
                AND policyname = 'psychology_session_broadcast_read'
            );
            SELECT 'realtime_logical_slots=' || count(*)
              FROM pg_replication_slots WHERE slot_type = 'logical';
            SELECT 'realtime_active_logical_slots=' || count(*)
              FROM pg_replication_slots WHERE slot_type = 'logical' AND active;
          "

          docker inspect --format='realtime_container_state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}unreported{{end}}' "$realtime_container"
          docker logs --tail 1200 "$realtime_container" 2>&1 | python3 -c '
          import sys
          patterns = (
              "RealtimeDisabledForConfiguration",
              "UnableToSubscribeToPostgres",
              "ReconnectSubscribeToPostgres",
              "UnableToConnectToTenantDatabase",
              "DatabaseConnectionDown",
              "StartReplicationFailed",
              "ReplicationConnectionTimeout",
              "ReplicationConnectionDown",
              "ReplicationConnectionRecoveryFailed",
              "ReplicationConnectionWatchdogTimeout",
              "ReplicationMaxWalSendersReached",
              "ErrorStartingPostgresCDC",
              "ReplicationSlotBeingUsed",
              "PoolingReplicationPreparationError",
              "PoolingReplicationError",
              "SubscriptionCleanupFailed",
              "RlsPolicyError",
              "Unauthorized",
              "UnableToBroadcastChanges",
              "ErrorExecutingTransaction",
              "ErrorExecutingQuery",
              "ErrorOnRpcCall",
              "RpcError",
              "MusterJoinError",
              "InitializingProjectConnection",
              "UnknownErrorOnChannel",
              "UnknownErrorOnWebSocketMessage",
              "UnableToHandleBroadcast",
              "ChannelShutdown",
              "ReplicationRecoveryWindowExceeded",
              "InvalidJWTToken",
              "ReplicationPollerConnectionFailed",
              "ReplicationPollerMaxRetriesReached",
              "SubscriptionManagerConnectionFailed",
              "CheckOidsError",
              "PublicationNotFound",
              "SubscriptionInsertFailed",
              "SubscriptionDeletionFailed",
          )
          counts = {pattern: 0 for pattern in patterns}
          error_lines = warning_lines = 0
          for line in sys.stdin:
              upper = line.upper()
              error_lines += "ERROR" in upper
              warning_lines += "WARN" in upper
              for pattern in patterns:
                  counts[pattern] += pattern in line
          print(f"realtime_log_error_lines={error_lines}")
          print(f"realtime_log_warning_lines={warning_lines}")
          for pattern, count in counts.items():
              if count:
                  print(f"realtime_log_{pattern}={count}")
          '

      - name: Instalar Chromium para os fluxos adaptativos
        run: npx playwright install --with-deps chromium

      - name: Playwright dos fluxos adaptativos
        run: npx playwright test e2e/adaptive-learning.spec.ts e2e/adaptive-learning-complete.spec.ts e2e/adaptive-learning-v2-guided.spec.ts e2e/adaptive-learning-v4-proof.spec.ts e2e/adaptive-learning-enem.spec.ts e2e/manual-timetable-v2.spec.ts e2e/director-mobile-branding.spec.ts e2e/tec-english-interactive.spec.ts e2e/finance-management.spec.ts e2e/psychologist-subdomain-access.spec.ts --config=e2e/playwright.config.ts

      - name: Anexar artefatos Playwright em falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-playwright-failure-${{ github.run_id }}
          path: |
            test-results/
            e2e/.runtime/
          if-no-files-found: ignore

      - name: Anexar evidências visuais da campanha UI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-ui-visual-evidence-${{ github.run_id }}
          path: test-results/**/visual/*.png
          if-no-files-found: ignore

  migration-promoter-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar roles requeridas pela migration do release
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'

      - name: Provar promoção histórica, cronológica e exceção do release #399
        shell: bash
        timeout-minutes: 15
        env:
          PROMOTION_TEST_DB_CONTAINER: ${{ job.services.postgres.id }}
          PROMOTION_TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          PROMOTION_TEST_SUPABASE_TIMEOUT_SECONDS: '120'
        run: bash scripts/db/promote-single-migration.postgres.test.sh
